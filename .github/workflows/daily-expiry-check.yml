name: Daily MOU Expiry Radar

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  check-expiries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Expiry Radar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'github-actions-secret-key' }}
          EMAIL_HOST_PASSWORD: ${{ secrets.RESEND_API_KEY }}
          DEFAULT_FROM_EMAIL: ${{ secrets.ALERT_EMAIL || 'admin@college.edu' }}
        run: |
          python manage.py check_mou_expiry
